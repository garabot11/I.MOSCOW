# Parametric tunnels, Hesai-like sensor (beam model of the dataset), 307 200-point /lidar_points layout.
set: val_hesai_param
source: parametric
sensor: hesai128
layout: 2400
storage: mcap
seed: 20261018
frame_id: hesai_lidar
mount_height_m: 1.3
pitch_deg: 0.0
divergence_deg: 0.0
speed_mps: [0.0, 20.0]
p_stationary: 0.25
scenes:
  count: 10
  negatives: 2
  frames: 120
tunnel:
  kinds: [circular, rectangular, double]
  p_curve: 0.4
  radius_m: [300, 2000]
  straight_before_curve_m: [0, 150]
  p_platform: 0.15
  length_m: 400
objects:
  n_objects: [1, 3]
  classes: [person_standing, person_crouching, person_lying, box, debris]
  class_weights: [3, 2, 1, 2, 1]
  d_range_m: [20, 300]
  reflectivity: [0.05, 0.6]
  p_out_of_clearance: 0.15
  p_crossing: 0.25
return_model: {}
