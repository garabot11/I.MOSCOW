# Parametric tunnels, Falcon Prime: slot table of the real recording, layout as recorded
# (/iv_points, frame "seyond", point_step 48, x forward / y left / z up, no zero points, is_2nd_return).
set: val_falcon_param
source: parametric
sensor: falcon_prime
storage: mcap
seed: 20261019
frame_id: seyond
topic: /iv_points
coordinate_mode: as_recorded     # as_recorded (= ros) | upside_down | native
mount_height_m: 1.98             # as recorded: 2.03 m above the track bed (bed = rail - 0.05 m)
pitch_deg: 2.33                  # as recorded (bed line slope)
divergence_deg: 0.1              # datasheet
line_shift_sd_deg: 0.06          # measured per-frame per-line azimuth jitter
speed_mps: [0.0, 20.0]
p_stationary: 0.25
scenes:
  count: 10
  negatives: 2
  frames: 100
tunnel:
  kinds: [double, circular, rectangular]
  p_curve: 0.35
  radius_m: [300, 2000]
  straight_before_curve_m: [0, 200]
  p_platform: 0.1
  length_m: 500
objects:
  n_objects: [1, 3]
  classes: [person_standing, person_crouching, person_lying, box, debris]
  class_weights: [4, 2, 1, 2, 1]
  d_range_m: [20, 320]
  reflectivity_ranges: [[0.05, 0.15], [0.15, 0.6]]   # dark clothing and normal
  p_out_of_clearance: 0.15
  p_crossing: 0.25
return_model: {}
