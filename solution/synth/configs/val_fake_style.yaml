# Objects inserted into real Hesai frames in three styles (work/specs/11_fake_style.md):
#   fake_a   - the organisers' cloud_with_fake_obj style (16-byte points, occluded returns deleted, OT128-grid object
#              points appended, intensity 1.0)
#   in_place - the organisers' org_synth style (organised layout kept, object hits replace farther returns, intensity 1)
#   physical - our physically plausible model (real beams, dual returns, range noise, intensity ~ reflectivity)
# Bases: unedited frames of cloud_with_fake_obj (the organisers' own base session), new_data, one development bag.
# d_end = along-track distance of the object at the last frame (moving train: it approaches from d_end + travelled).
set: val_fake_style
source: fake_style
sensor: hesai128
storage: mcap
seed: 20261019
frame_id: hesai_lidar
topic: /lidar_points
