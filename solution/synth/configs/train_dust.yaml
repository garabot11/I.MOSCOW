# Training: dust clouds (class dust, never an obstacle), single and dual return, objects inside/behind dust,
# plus ordinary objects elsewhere in the scene.
set: train_dust
source: parametric
sensor: hesai128
layout: 2400
storage: mcap
seed: 31020
frame_id: hesai_lidar
mount_height_m: 1.3
divergence_deg: 0.0
speed_mps: [0.0, 10.0]
p_stationary: 0.4
p_single_return: 0.5
scenes:
  count: 14
  negatives: 0
  frames: 80
tunnel:
  kinds: [circular, rectangular, double]
  p_curve: 0.25
  radius_m: [400, 2000]
  p_platform: 0.1
  length_m: 400
objects:
  n_objects: [0, 2]
  classes: [person_standing, person_crouching, box, debris]
  class_weights: [3, 2, 2, 1]
  d_range_m: [20, 200]
  reflectivity: [0.05, 0.6]
dust:
  n_clouds: [1, 3]
  d_range_m: [6, 90]
  lateral_m: [-2.0, 2.0]
  height_m: [0.2, 2.2]
  radius_m: [0.6, 3.5]
  n_puffs: [6, 20]
  puff_sigma_m: [0.25, 1.1]
  extinction_per_m: [0.04, 1.0]
  drift_mps: [0.1, 2.0]
  p_object_behind: 0.5
  object_classes: [person_standing, person_crouching, box]
return_model: {}
