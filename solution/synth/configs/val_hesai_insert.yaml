# Objects inserted into real Hesai frames (stationary segments of the development bags), fixed seed.
set: val_hesai_insert
source: insert_real
sensor: hesai128
layout: 2400            # 307 200-point /lidar_points layout
storage: mcap
seed: 20261017
frame_id: hesai_lidar
divergence_deg: 0.0     # Hesai: the gate matches without divergence (ratio 0.937)
scenes:
  count: 8
  negatives: 1          # scene 0 has no inserted object (real background only)
  frames: 120
  min_segment: 40
  bags: [squareT_platform_squareT_switch, doubleT_platform]
objects:
  n_objects: [1, 3]
  classes: [person_standing, person_crouching, person_lying, box, debris]
  class_weights: [3, 2, 1, 2, 1]
  d_range_m: [20, 210]
  reflectivity: [0.05, 0.6]
  p_out_of_clearance: 0.15
  p_crossing: 0.25
return_model: {}
