# Dust clouds (must not be detected) with single- and dual-return variants; some with an object inside/behind.
set: val_dust
source: parametric
sensor: hesai128
layout: 2400
storage: mcap
seed: 20261020
frame_id: hesai_lidar
mount_height_m: 1.3
divergence_deg: 0.0
speed_mps: [0.0, 8.0]
p_stationary: 0.5
p_single_return: 0.5          # per scene: strongest echo only (both columns identical) vs dual return (dust = near)
scenes:
  count: 10
  negatives: 0
  frames: 100
tunnel:
  kinds: [circular, rectangular, double]
  p_curve: 0.2
  radius_m: [400, 2000]
  p_platform: 0.1
  length_m: 400
objects:
  n_objects: [0, 0]           # objects only via dust.p_object_behind
dust:
  n_clouds: [1, 3]
  d_range_m: [8, 80]
  lateral_m: [-1.5, 1.5]
  height_m: [0.3, 1.8]
  radius_m: [0.8, 3.0]
  n_puffs: [6, 20]
  puff_sigma_m: [0.3, 1.0]
  extinction_per_m: [0.05, 0.8]   # visibility 3/alpha = 4-60 m inside the densest puff
  drift_mps: [0.1, 1.5]
  p_object_behind: 0.5
  object_classes: [person_standing, person_crouching, box]
return_model: {}
