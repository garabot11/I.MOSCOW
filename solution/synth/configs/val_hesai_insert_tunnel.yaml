# Objects inserted into a real *tunnel* background: doubleT_obstacle (stationary double-track tunnel) with the
# real object removed and cropped to the 307 200-point /lidar_points layout (synth/clean_source.py), fixed seed.
set: val_hesai_insert_tunnel
source: insert_real
sensor: hesai128
layout: 2400
storage: mcap
seed: 20261021
frame_id: hesai_lidar
divergence_deg: 0.0
scenes:
  count: 6
  negatives: 1
  frames: 100
  min_segment: 40
  bags: [doubleT_obstacle_clean307]
objects:
  n_objects: [1, 3]
  classes: [person_standing, person_crouching, person_lying, box, debris]
  class_weights: [3, 2, 1, 2, 1]
  d_range_m: [20, 210]
  reflectivity: [0.05, 0.6]
  p_out_of_clearance: 0.15
  p_crossing: 0.25
  max_occluded_frac: 0.25
return_model: {}
