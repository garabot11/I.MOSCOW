# Detector parameters (flat mapping). Distances in metres, times in seconds.
# The same file is read by the ROS node (config_file) and the offline evaluator (--config).
# Every key can also be overridden as a ROS parameter of the same name.
# Generated by scripts/gen_config.py from the defaults in config.py; edit either and keep them in sync.

forward_axis: "-y"  # sensor axis pointing along the track ahead of the train
up_axis: "+z"  # sensor axis pointing up
axes_mode: "auto_if_needed"  # "config" = always forward_axis/up_axis; "auto_if_needed" = keep them while the track bed is found with them, otherwise detect the axes from the cloud once per sensor
forward_crop_deg: 80.0  # organised clouds: keep firing columns within this azimuth of forward before any processing (|az| > 80 deg cannot reach d >= d_min inside |l| <= l_abs_max); 0 = off
d_min: 3.0  # ignore returns closer than this (own train body / near-field clutter)
d_max: 300.0  # maximum analysed range along the track
l_abs_max: 12.0  # lateral half-width of the analysed slab
h_abs_min: -8.0  # absolute height limits relative to the sensor
h_abs_max: 10.0
min_valid_points: 2000  # fewer valid points -> status "unknown"
max_analysed_points: 0  # 0 = off (recommended); else keep every k-th point of the analysed region so that at most this many remain. Last-resort load reduction: 180000 halved the 921k-point sensor and the obstacle at 56 m was then found in 12 of 47 frames instead of 47
floor_fit_d_max: 120.0  # bins up to this range are used for the fit (sparser bins get lower weight)
floor_bin_m: 2.0  # longitudinal bin size for the floor percentiles
floor_lateral_halfwidth: 1.0  # lateral half-width around the track centre
floor_percentile: 50.0  # median of track-bed returns ~ rail-head level
floor_min_points: 40  # minimum returns per bin to trust its percentile (near range)
floor_min_points_far: 8  # minimum returns per bin beyond floor_near_d
floor_quad_min_range_m: 60.0  # the quadratic term is fitted only when the bed is observed at least this far
floor_near_d: 45.0
floor_min_bins: 4  # minimum bins for a valid fit, else "unknown"
floor_residual_m: 0.25  # outlier rejection threshold for the fit (near range)
floor_residual_per_m: 0.003  # far gate widens with range beyond floor_near_d
floor_far_residual_m: 0.15  # base gate for sparse far bins around the near-range extrapolation
floor_max_gap_m: 20.0  # far bins must continue the accepted bins without a larger gap
floor_min_vertical_radius_m: 2500.0  # bounds the quadratic term of the rail-level fit
floor_h_max: -0.3  # only returns below the sensor (h <= this) can be track bed
floor_step_up_max_m: 0.0  # > 0: a dense bed bin whose level rises by more than this over the last bed bin is not bed (an
trough_search_d: [4.0, 25.0]
trough_search_l_max: 2.0
trough_depth_min: 0.15  # trough returns lie this far below rail level ...
trough_depth_max: 0.9  # ... and not deeper than this (drain pits, gaps)
trough_width_m: 1.2  # densest window of this width defines the trough
trough_min_points: 150
sensor_lateral_offset: 0.0  # used when no trough is found (metres, +l = towards +lateral axis)
profile_band_above_rail: [0.4, 3.6]  # heights above rail level used for the profile
profile_l_max: 12.0
profile_bin_m: 0.1
profile_d_edges: [3.0, 6.0, 9.0, 12.0, 15.0, 18.0, 21.0, 24.0, 27.0, 30.0, 33.0, 36.0, 39.0, 42.0, 45.0, 48.0, 51.0, 54.0, 57.0, 60.0, 66.0, 72.0, 78.0, 84.0, 90.0, 96.0, 102.0, 108.0, 114.0, 120.0, 126.0, 132.0, 138.0, 144.0, 150.0, 165.0, 180.0, 195.0, 210.0, 225.0, 240.0, 255.0, 270.0, 285.0, 300.0, 315.0]
profile_min_points: 25
chain_min_corr: 0.5  # adjacent-bin profiles must correlate at least this well
chain_shift_slack_m: 0.3  # extra lateral slack per bin pair beyond the curvature bound
curve_fit_d_max: 160.0
curve_max_abs_a: 0.045  # |yaw slope| bound (rad): mounting yaw + car yaw against the local tangent; 0.025 was too tight (synthetic R=600 m curve, Falcon mount a=-0.024), 0.06 let the fit drift at stations
curve_min_radius_m: 200.0  # |b| <= 1 / (2 R_min)
curve_residual_base_m: 1.0  # residual gate for chained-shift samples (base + per_m * d)
curve_residual_per_m: 0.02
curve_smoothing: 0.0  # EMA weight for the previous frame's coefficients (0 = none; the fit priors do the smoothing)
chain_weight: 0.3  # relative weight of chained profile shifts vs absolute samples
chain_extra_range_m: 40.0  # chain samples are used at most this far beyond the last absolute sample
trough_weight: 2.0  # weight of the trough-centre prior
trough_l0_gate_m: 0.5  # the fitted l0 may deviate at most this much from the trough centre
yaw_prior_weight: 0.3  # weak prior pulling the yaw term towards the previous frame (weight of a 1 m offset at 100 m)
curv_prior_weight: 0.3  # weak prior pulling the curvature term towards the previous frame (same units)
sym_d_edges: [4.0, 10.0, 16.0, 22.0, 28.0, 34.0, 40.0]
sym_half_window_m: 1.1  # mirror window: rails at +-0.76 m and the trough are inside it
sym_cell_m: 0.05
sym_center_range_m: 1.2  # search range for the symmetry axis
sym_percentile: 20.0  # per-cell height statistic (robust to objects above the bed)
sym_min_points: 300
sym_max_score: 0.04  # mean |h(c+u) - h(c-u)| above this -> bin discarded
sym_ref_score: 0.02  # score giving unit weight
sym_residual_base_m: 0.3
wall_band_above_rail: [1.5, 3.0]  # band where walls/columns/gates bound the track
wall_width_range: [3.6, 5.8]  # plausible free width between the two sides (gate 4.0 .. round 5.4)
wall_min_points: 20
wall_occ_min: 2.0  # smoothed (3-cell) count that marks a lateral cell as occupied ...
wall_occ_frac: 0.01  # ... or this fraction of the bin's points, whichever is larger
wall_weight: 0.5
wall_weight_decay_d: 60.0  # wall/ceiling sample weight ~ 1 / (1 + d / this)
wall_prior_gate_base_m: 0.8  # seed gate (near range) around the linear near-range fit
wall_prior_gate_per_m: 0.02
wall_track_gate_base_m: 0.6  # bin-to-bin gate around the local extrapolation of accepted samples
wall_residual_base_m: 0.5
ceiling_band_above_rail: [3.0, 5.0]
ceiling_centre_min_points: 15
ceiling_weight: 0.5
gauge_halfwidth_low: 1.0  # |l - l_c| bound below low_zone_top (contact-rail covers start ~1.2 m from the track centre)
gauge_halfwidth_body: 1.4  # |l - l_c| bound for the car-body zone (car half-width 1.35; platform edges start at ~1.45 m)
low_zone_top_above_rail: 0.8
box_bottom_above_rail: 0.3  # minimum height above rail level to be a candidate
box_top_above_rail: 3.4  # car roof ~3.7 m; pressure-gate lintel ~3.8 m
bottom_margin_per_m: 0.002  # extra bottom margin per metre of range where the track bed is observed ...
bottom_margin_beyond_per_m: 0.008  # ... and per metre beyond the last observed track-bed bin (extrapolation)
margin_rms_factor: 1.0  # margins also grow with the rail-level fit residual (rms) times this factor
top_margin_per_m: 0.002  # box top lowers by this per metre of range (same reasons) ...
top_margin_beyond_per_m: 0.006
lateral_shrink_per_m: 0.003  # box half-width shrink per metre (centre-line error at range)
lateral_curv_factor: 0.1  # additional shrink = factor * |b| * d^2 (curvature uncertainty: no view around the bend) (0.25 before: at stations a spurious curvature of 1/700 m shrank the corridor to 0.36 m at 50 m)
lateral_curv_factor_strong: 0.25  # the factor in strong curves (|b| >= lateral_curv_strong_b, R <= 1.7 km): the quadratic over-bends there
lateral_curv_strong_b: 0.0003  # (roundT_pressureGate: a creeping train in an R = 880 m curve put wall returns 0.4 m from the extrapolated centre at 73 m)
lateral_curv_ramp_b: 0.0001  # width of the ramp between the two factors
lateral_min_halfwidth: 0.7
report_beyond_support_m: 15.0  # candidates farther than the last wall/ceiling/symmetry sample + this are not reported
cluster_eps_base_m: 0.35
cluster_eps_per_m: 0.004  # point spacing grows ~0.0026 m per m (0.15 deg)
min_points_near: 5
min_points_far: 4
far_range_m: 100.0
cluster_max_extent_d: 6.0  # longer clusters are infrastructure (rails, cables, walls in curves)
cluster_min_extent_m: 0.1  # at least one of lateral/height extents must reach this
low_flat_max_height_m: 0.2  # clusters lower than this and longer than low_flat_min_length_m along the track are
low_flat_min_length_m: 1.0  # track-bed infrastructure (cable ducts, train stops, guard rails), not objects
edge_sliver_max_width_m: 0.35  # thin slivers hugging the lateral box edge (platform edges, ducts) are rejected
edge_sliver_margin_m: 0.15
cluster_min_extent_h_far: 0.25  # beyond far_range_m a candidate must span >= 2 scan rings
shape_rule_beyond_d: 60.0  # beyond this range flat patches (floor/ceiling/grazing walls) are rejected ...
grazing_planarity_max: 0.03  # far clusters (with neighbours) whose PCA planarity is below this ...
grazing_cos_max: 0.35  # ... and whose normal is nearly perpendicular to the line of sight are grazing surfaces
shape_min_height_ratio: 0.5  # ... unless height >= ratio * max(horizontal extents)
attach_radius_m: 0.35  # neighbourhood used to test attachment to structure outside the box
attach_radius_per_m: 0.008  # grows with range (point spacing and centre-line error)
attach_ratio: 1.0  # reject an edge cluster when outside neighbours > ratio * own points
ceiling_margin_m: 0.6  # box top is capped this far below the observed ceiling
above_footprint_d_m: 0.8  # footprint slack (along track) for the 'extends above the top' test
above_footprint_l_m: 0.4  # footprint slack (lateral)
above_min_points: 3  # returns above the box top inside the footprint -> structure
above_band_m: 1.2  # returns must lie within this band right above the cluster
face_min_width_m: 1.5  # a cluster this wide across the corridor, thin along the track and centred is a face
face_max_depth_m: 1.0  # (a train standing ahead, a closed gate, a panel): never 'structure reaching the ceiling'
face_max_center_offset_m: 0.9
face_min_points: 20
flat_sliver_max_h_m: 0.12  # a cluster this thin vertically and at least flat_sliver_min_w_m wide/long is a cable, duct or floor patch
flat_sliver_min_w_m: 0.4  # (with D2 bridging pixel gaps, 2-3 cm thick slivers at 3 m height were confirmed on the edited bag)
flat_sliver_min_h_above_rail_m: 1.5  # only slivers hanging this high are structure: a flat plate 0.5 m above the rails is an obstacle
face_min_height_m: 1.5  # ... and tall inside the box with its lowest returns low (a lintel or a grid is neither)
face_max_bottom_m: 1.5
d1_plate_exception: true  # a plate across the corridor (wide, short along the track, centred, low) is not a "flat patch at range" / "grazing surface" (the organisers' 2 m plate 0.5 m above the rails, seen edge-on from 90 m); D2 must still agree
plate_min_width_m: 0.8  # plate: lateral extent at least this ...
plate_max_depth_m: 0.6  # ... extent along the track at most this ...
plate_max_center_offset_m: 0.6  # ... centre this close to the centre-line ...
plate_max_height_above_rail_m: 1.2  # ... mean height above rail at most this ...
plate_min_points: 6  # ... and at least this many voxels
plate_d2_min_bg_frac: 0.5  # ... and a cluster accepted only by the exception votes only with a voting D2 obstacle group at the same place that has at least this fraction of its boundary ring in the background (a plate on the bed casts a shadow; the 0.2 m step at 69 m in the organisers' platform frames is continuous with the surface behind it)
ceiling_min_height_m: 2.5  # only returns this high above rail define the ceiling
ceiling_min_points: 10
voxel_base_m: 0.08  # candidate voxel size at range 0 ...
voxel_per_m: 0.002  # ... growing with range
ceiling_extension: true  # beyond the observed bed take rail = ceiling profile - tunnel height
ceiling_ext_bin_m: 5.0  # range bins for the ceiling profile
ceiling_ext_lateral_m: 1.5  # ceiling samples within this lateral distance of the centre-line
ceiling_height_tol_m: 0.3  # tunnel height must be constant within this in the near range; far bins are gated by it (+2 mm/m)
ceiling_ext_min_bins: 3  # at least this many ceiling bins beyond the bed, else no extension
ceiling_ext_max_gap_m: 30.0  # the ceiling profile must be continuous (no larger gap between accepted bins)
ceiling_ext_max_drift_m: 0.5  # ceiling-derived rail may differ from the bed extrapolation by this ...
ceiling_ext_drift_per_m: 0.005  # ... plus this per metre beyond the bed (a vertical curve), else the extension stops
bottom_margin_ext_per_m: 0.004  # box bottom growth per metre beyond the observed bed while the ceiling carries the rail (0.008 beyond that)
wall_sweep_check: true  # cap the corridor where a tunnel wall sweeps into it (a bend the centre-line fit
wall_sweep_min_d: 40.0  # the check starts here (nearer, the fit is supported and a standing train must stay reportable)
wall_sweep_bin_m: 5.0
wall_sweep_h_min: 0.5  # wall-height band above rail used by the check (floor and ceiling excluded)
wall_sweep_h_max: 3.0
wall_sweep_l_max: 4.0  # returns farther than this from the centre-line are not walls of this tunnel
wall_sweep_min_pts: 4  # returns per bin and side needed to place the wall's inner edge (far walls are sparse columns)
wall_sweep_span_min_m: 1.2  # a wall is tall: height span of the bin's inner surface
wall_sweep_margin_m: 0.1  # a wall closer than gauge_halfwidth_body + this to the centre-line is inside the corridor
wall_sweep_total_m: 0.8  # the inner edge must come in by at least this over the three bins ...
wall_sweep_deep_total_m: 0.5  # ... or by this when it ends deep inside (below the inside bound - wall_sweep_deep_m):
wall_sweep_deep_m: 0.4  # round-tunnel walls read 0.3-0.5 m closer where lower rings sample them, never 0.8 m
wall_sweep_step_m: 0.15  # the inner edge must approach the centre-line by at least this per 5 m over three bins
straight_max_abs_b: 0.0001  # |b| below this (R > 5 km) = straight section: the corridor support extends to the ceiling-covered range
straight_keep_abs_b: 0.00015  # ... and once extended it stays extended while |b| is below this (hysteresis: the Falcon tunnel fits
floating_beyond_d: 100.0  # beyond this range a cluster whose lowest point is >= floating_bottom_above_rail ...
floating_bottom_above_rail: 1.5  # ... above the rail is hanging infrastructure (lamps, signs, cables), not an object on the track
ceiling_percentile: 98.0
attach_edge_margin_m: 0.3  # near range: only clusters this close to the box edge are tested ...
attach_all_beyond_d: 60.0  # ... beyond this range every cluster is tested (centre-line error grows)
distance_percentile: 10.0  # robust "nearest surface" range inside a cluster (min if < 10 points)
confirm_hits: 2  # hits needed inside the window to confirm a track
confirm_window: 3  # frames
confirm_hits_far: 3  # stricter confirmation for candidates beyond far_range_m ...
confirm_window_far: 4  # ... (sparse returns, larger track-model error)
track_max_misses: 3
assoc_lateral_m: 1.2
assoc_d_closer_m: 8.0  # object may come closer by this much between frames (train speed)
assoc_d_farther_m: 2.5
max_gap_s: 1.5  # larger gaps between frames reset temporal state
stale_timeout_s: 1.5  # node-only: no input for this long -> "unknown"
fusion_enabled: true  # False = the D1 temporal filter alone (confirm_hits / confirm_window)
far_weak_d1_vote: true  # train standing (static fraction >= far_weak_d1_static_frac): beyond far_range_m a D1 cluster rejected only for its point support (one scan line, < min_points_far) votes when a voting D2 obstacle group lies at the same place in the same frame (the dark person at 150 m on the Falcon bag)
far_weak_d1_min_points: 3  # ... such a weak cluster needs at least this many voxels
far_weak_d1_static_frac: 0.85  # ... and the scene must be at least this static (unchanged range-image pixels)
far_vote_d1_min_d: 140.0  # 0 = off; train moving (static fraction < far_weak_d1_static_frac): beyond this range a D1 cluster with fewer than far_vote_d1_min_points voxels adds evidence but does not vote (sparse far wall returns at 156-165 m on the 20-minute ride)
far_vote_d1_min_points: 5
compact_pair_vote: true  # a small compact D1 cluster (also one rejected only for its support or as a short edge sliver) and an isolated D2 obstacle group at the same place in the same frame both vote, whatever their size-normalised scores (a 0.3 m cube scores 0.15-0.25 in both detectors)
compact_max_extent_m: 1.0  # ... both at most this large in every direction
compact_min_d1_points: 3  # ... the D1 cluster has at least this many voxels
compact_sliver_max_length_m: 0.6  # ... an edge "sliver" this short along the track ...
compact_min_thickness_m: 0.1  # ... and at least this thick laterally and vertically is a compact object, not a platform edge
compact_min_d2_px: 4  # ... the D2 group has at least this many pixels,
compact_max_attached: 0.05  # ... no attached neighbours (at most this fraction),
compact_min_bg_frac: 0.9  # ... and at least this fraction of its boundary ring is background (free space behind it)
compact_pair_dd_m: 1.5  # ... "same place": along-track ...
compact_pair_dl_m: 0.5  # ... and lateral distance between the D1 and D2 centres
compact_isolation_d_m: 2.5  # ... and the D1 cluster stands alone: no larger D1 cluster, and no other cluster of compact_min_d1_points outside the pair window, within this distance along the track ...
compact_isolation_l_m: 2.0  # ... and this distance across (a dust cloud breaks into many small clusters a metre apart; a 0.3 m cube has nothing around it)
axis_cross_exempt: true  # a D1 cluster spanning the track axis (by >= axis_cross_min_m on both sides of the centre-line) is in the train's path:
axis_cross_min_m: 0.25  # the attachment test does not apply (structure leaking in at the box edge never reaches across the axis; the organisers' beam across the rails sticks out of the low zone on one side and had more returns outside than inside)
axis_cross_max_depth_m: 0.5  # ... when it is thin along the track (their beam: <= 0.11 m; a dust cloud across the corridor 1.2-1.6 m was confirmed through it on val_dust)
hanging_central_exempt: true  # a D1 cluster hanging into the middle of the corridor at short range is not structure: neither the 'extends above' nor the attachment test applies
hanging_central_max_d: 70.0  # ... (the organisers' tilted cable from the ceiling down to 2.0 m above the rails): within this range,
hanging_central_min_bottom_m: 1.8  # ... lowest return at least this high above the rail (free space below it: nothing stands on the track there),
hanging_central_edge_m: 0.5  # ... every return at least this far inside the lateral box edge (walls and columns stand at the edge)
straddle_compact_exempt: true  # compact path only (compact_pair_vote): the 'outside' neighbours of a small cluster at the box edge are the rest
straddle_grow_m: 0.15  # of the same object when, grown through the returns outside the box (step straddle_grow_m + straddle_grow_per_m * d),
straddle_grow_per_m: 0.004  # they stay within compact_max_extent_m together with the cluster: not attached to structure (the organisers' cube on
straddle_max_points: 3000  # the left rail, two thirds of it beyond the low zone); a cover, a platform edge or a wall grows past it
straddle_chunk: 128  # frontier points per neighbour query of the growth (bounds the cost on dense structure, result unchanged)
straddle_thin_exempt: true  # ... and an edge sliver too thin for the compact path (min(width, height) < compact_min_thickness_m: the top face of a cube
straddle_min_bg_frac: 0.4  # such a cluster pairs with a D2 group whose boundary ring is at least this much background (the object's own part beyond
d2_enabled: true  # beam detector on the range image
d2_az_limit_deg: 25.0  # range-image sector around forward used by D2 (the corridor at d_min=3 m spans +-25 deg)
d2_bridge_empty_bins: true  # unorganised (binned) clouds only: D2 joins small in-box fragments separated by empty bins and looks through empty bins for their neighbours (an object sampled coarser than the bins - the organisers' inserted plate - fell apart into 1-2 px fragments with no neighbour)
d2_bridge_min_vspan_deg: 33.0  # ... only on a stream whose binned image spans at least this many degrees vertically: the Hesai class (OT128 39.5 deg); the Falcon Prime (25 deg) is not bridged (the rule cost it frames where the corridor model breaks)
d3_enabled: true  # neural detector on the range image (needs PyTorch and a model file; silently off otherwise)
d3_model_path: ""  # TorchScript model; empty = METRO_D3_MODEL, /workspace/models/d3_unet.pt or <repo>/solution/models/d3_unet.pt
d3_min_pixels: 10  # smaller D3 components only add weak evidence (score x0.3) and do not vote
d3_corridor_margin_m: 0.3  # D3 components farther than this outside the clearance (laterally / in height) are dropped
d3_cpu_stride: 3  # in CPU modes the network runs on every n-th frame
d3_max_ms: 120.0  # three consecutive D3 calls above this disable D3 (real time first)
model_hold_s: 1.0  # keep the last rail/track model this long when the fit fails (object blocking the near bed)
static_hold: true  # while the scene is static (train standing) keep the rail/track model of the previous frame instead of re-fitting it
static_min_frac: 0.9  # fraction of range-image pixels whose range did not change (within static_tol) for the scene to count as static
static_tol_m: 0.05  # ... plus 0.2 % of the range
static_warmup: 5  # static frames whose per-frame models are estimated before their median is frozen
quasi_static_frac: 0.85  # above this (but below static_min_frac) the model is the median of the last quasi_static_frames fits:
quasi_static_frames: 5  # 0.5 s (15 frames lagged a slowly moving train into 5 false frames on roundT_pressureGate)
debug_cloud: true
marker_corridor: true
marker_corridor_volume: true  # draw the clearance corridor as a translucent volume (floor + side walls) up to verified_to_m
corridor_ext_ramp_frac: 0.2  # the straight-section extension of the verified range fades out linearly over this fraction of the
corridor_static_b_window: 300  # while the scene is quasi-static, the extension is decided on the median |b| of up to this many
corridor_static_b_min_frames: 10  # ... once at least this many quasi-static fits are collected
corridor_static_b_max: 0.00025  # ... and only while the frame's own |b| is below this (a real curve is never averaged away)
corridor_curv_shape_factor: 1.0  # curvature shrink (curv_factor |b| d^2) is scaled by this where the fitted centre-line follows the
corridor_curv_shape_ref_d: [15.0, 30.0]  # chain residuals over this range give the anchor offset
corridor_curv_shape_tol_m: 0.25  # ... the shape is followed while a chain residual stays within this of the offset
corridor_curv_shape_max_gap_m: 12.0  # ... and the chain samples are not farther apart than this
marker_status_ahead_m: 20.0  # RViz status text: this far ahead of the sensor along the track (at the sensor it sat on the view's bottom edge)
marker_status_height_m: 7.0  # ... and this high above the sensor (above the tunnel cross-section in the default view)
